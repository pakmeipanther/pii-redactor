  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="560" y="262" font-size="92" font-weight="800" fill="#fff" letter-spacing="-2">PII Redactor</text>
    <rect x="560" y="290" width="120" height="8" rx="4" fill="#ffaa28"/>
    <text x="560" y="365" font-size="42" font-weight="500" fill="#dbe6f7">Share documents. Not identities.</text>
    <text x="560" y="425" font-size="27" fill="#9db4d6">Remove personal data and secrets from text, images,</text>
