    <path fill="#183a6e" d="M619 320 L965 192 L1585 382 V1050 C1585 1400 1280 1630 965 1740 C650 1630 347 1400 347 1050 V618 H483 V1030 C483 1300 700 1480 965 1596 C1230 1480 1449 1300 1449 1030 V492 L965 339 L619 459 Z"/>
    <path fill="#ffaa28" d="M347 382 L579 331 V468 L483 490 V580 H347 Z"/>
    <path fill="#fff" stroke="#183a6e" stroke-width="57" stroke-linejoin="miter" d="M647 595 H1140 L1283 738 V1362 H647 Z"/>
