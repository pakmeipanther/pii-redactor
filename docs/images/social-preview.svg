      <stop offset="0" stop-color="#0d2547"/>
      <stop offset="1" stop-color="#183a6e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- logo -->
  <svg x="90" y="120" width="400" height="400" viewBox="66 66 1800 1800">
